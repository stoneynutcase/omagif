name: Integration

# These tests talk to Giphy for real, which is the point of them. The keyless
# provider reads markup Giphy never promised to keep, so the breakage arrives
# on Giphy's schedule rather than on ours — hence the daily run, not just a
# run on push.
#
# Setup: add a Giphy API key as the repository secret GIPHY_API_KEY
# (Settings → Secrets and variables → Actions). Without it the keyed job still
# runs and simply skips the tests that need a key, so pull requests from forks
# — which never receive secrets — are not failed for something the contributor
# cannot fix.

on:
  schedule:
    # Daily, deliberately off the hour: GitHub delays scheduled jobs that all
    # pile onto :00.
    - cron: "27 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Providers.js"
      - "providers/**"
      - "test/**"
      - "setup"
      - "bin/**"
      - "manifest.json"
      - ".github/workflows/integration.yml"
  pull_request:
    paths:
      - "Providers.js"
      - "providers/**"
      - "test/**"
      - "setup"
      - "bin/**"
      - "manifest.json"
      - ".github/workflows/integration.yml"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  # Superseding a pull request's run is fine; cancelling the daily canary
  # because someone pushed is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  keyless:
    name: Keyless (giphy.com search page)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Offline: catalogue/registry consistency and URL building. Fast, and it
      # localises a failure — if this passes and the live job does not, the
      # plugin is fine and Giphy moved.
      - name: Catalogue and registry
        run: node --test --test-reporter=spec test/registry.test.mjs

      # Also offline. Covers the shell scripts, which the provider tests do
      # not touch — including running the CLI through a symlink, the way
      # `omagif install` sets it up.
      - name: Shell scripts
        run: node --test --test-reporter=spec test/shell.test.mjs

      - name: Live keyless search (Giphy)
        run: node --test --test-reporter=spec test/keyless.test.mjs

      - name: Live keyless search (Tenor)
        run: node --test --test-reporter=spec test/tenor-keyless.test.mjs

  keyed:
    name: Keyed (Giphy API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Live keyed search
        run: node --test --test-reporter=spec test/keyed.test.mjs
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}

  report:
    name: Report a broken daily run
    needs: [keyless, keyed]
    # Only for the unattended run. A failure on a push or a pull request is
    # already in front of whoever caused it.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = "Daily integration run is failing";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const body = [
              `The scheduled integration run failed: ${run}`,
              "",
              "Where to look first:",
              "",
              "- **Keyless** reads the public search pages of giphy.com and tenor.com. If that",
              "  job failed, check which step: Giphy looks for anchors carrying `data-giphy-id`,",
              "  Tenor for `<figure class=\"UniversalGifListItem\">` wrapping a `/view/` link.",
              "  Users on that no-key provider will be seeing \"no results\" for every search.",
              "- **Keyed** calls the Giphy API with the `GIPHY_API_KEY` secret. If that job failed,",
              "  check the key is still valid and in quota before suspecting the code.",
            ].join("\n");

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = open.find((i) => i.title === title && !i.pull_request);

            if (existing) {
              // One issue for the outage, a comment per day it persists.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
